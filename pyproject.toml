[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-engine"
version = "0.4.2"
description = "Autonomous Event-driven Task & Hybrid Evaluation Runtime — Mission-Critical AI Agent Control Plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AETHER Systems Engineering", email = "core@aether-engine.io" }
]
keywords = ["ai", "agents", "orchestration", "dag", "circuit-breaker", "guardrails", "opentelemetry", "evals"]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
infra = [
    "redis>=5.0.4",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/aether-core/src/aether_core",
    "packages/aether-guardrails/src/aether_guardrails",
    "packages/aether-evals/src/aether_evals",
    "server/src/aether_server",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/aether-core/tests",
    "packages/aether-guardrails/tests",
    "packages/aether-evals/tests",
    "server/tests",
]
pythonpath = [
    "packages/aether-core/src",
    "packages/aether-guardrails/src",
    "packages/aether-evals/src",
    "server/src",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "packages/aether-core/src:packages/aether-guardrails/src:packages/aether-evals/src:server/src"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "packages/aether-core/src",
    "packages/aether-guardrails/src",
    "packages/aether-evals/src",
    "server/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "BLE", "A", "C4", "T20", "RUF"]
ignore = ["S101", "S105", "T201", "BLE001", "E501"]
