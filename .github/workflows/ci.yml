name: AETHER CI — Lint, Strict Typecheck & Test Matrix

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Ruff Lint & Mypy Strict (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff Linter
        run: uv run ruff check .
      - name: Run Mypy Strict Typecheck
        run: uv run mypy packages/aether-core/src packages/aether-guardrails/src packages/aether-evals/src server/src

  unit-and-integration-tests:
    name: Pytest Suite & Coverage Gate (>90%)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_state
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Execute Test Suite with Coverage Gate
        run: |
          uv run pytest --cov=aether_core --cov=aether_guardrails --cov=aether_evals --cov=aether_server --cov-fail-under=90
