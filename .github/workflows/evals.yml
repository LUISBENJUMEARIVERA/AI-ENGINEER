name: AETHER Continuous Evals — 50-Case Golden Benchmark Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  golden-dataset-eval:
    name: Golden Dataset Quality & p95 SLA Gate (>=90% Accuracy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run 50-Question Hybrid Evaluation Suite
        run: |
          uv run python -c "
          import asyncio, sys
          from aether_evals import HybridEvaluationRunner
          report = asyncio.run(HybridEvaluationRunner(min_accuracy_threshold=0.90, max_p95_latency_ms=12.0).run_suite())
          print(report.model_dump_json(indent=2))
          if not report.quality_gate_passed:
              sys.exit(1)
          "
