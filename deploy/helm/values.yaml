replicaCount: 4

image:
  repository: ghcr.io/aether-systems/aether-engine
  pullPolicy: IfNotPresent
  tag: "0.4.2"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 32
  targetCPUUtilizationPercentage: 70

gateway:
  slaMaxLatencyMs: 4500
  circuitBreakerFailureThreshold: 3
  recoveryTimeoutSec: 15.0
  fallbackChain:
    - gemini-2.0-pro
    - claude-3-5-sonnet
    - gpt-4o
    - vllm-llama-3.1-70b

telemetry:
  otlpEndpoint: "http://jaeger-collector.observability.svc.cluster.local:4317"
